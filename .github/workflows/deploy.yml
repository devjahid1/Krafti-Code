name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST || secrets.VPS_HOST }}
      DEPLOY_USERNAME: ${{ secrets.USERNAME || secrets.VPS_USERNAME }}
      DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_PORT: ${{ secrets.PORT || secrets.VPS_PORT || '22' }}

    steps:
      - name: Validate deployment secrets
        run: |
          missing=()
          [ -z "${DEPLOY_HOST}" ] && missing+=("HOST or VPS_HOST")
          [ -z "${DEPLOY_USERNAME}" ] && missing+=("USERNAME or VPS_USERNAME")
          [ -z "${DEPLOY_KEY}" ] && missing+=("SSH_PRIVATE_KEY or VPS_SSH_PRIVATE_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required deployment secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USERNAME }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}

          script: |
            cd /home/deploy/Krafti-Code

            git pull origin main

            npm install

            npm run build

            sudo rm -rf /var/www/html/*

            sudo cp -r dist/* /var/www/html/

            sudo systemctl reload nginx